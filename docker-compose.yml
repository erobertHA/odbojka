services:
  backend:
    build: ./backend
    container_name: volleyball-backend
    restart: unless-stopped
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      SECRET_KEY: ${SECRET_KEY:-please-change-this-to-a-long-random-secret}
      DATABASE_URL: sqlite:////data/volleyball.db
    volumes:
      - volleyball_data:/data
    expose:
      - "8000"

  frontend:
    build: ./frontend
    container_name: volleyball-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

volumes:
  volleyball_data: